
# SQLite datasource (relative path from project root)
spring.datasource.url=jdbc:sqlite:../database/inventory.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC

# Use the custom SQLite dialect
spring.jpa.database-platform=com.inventory.config.SQLiteDialect

# Do not let Hibernate auto-create schema (we provide schema.sql), but ensure SQL init runs
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jpa.show-sql=true

